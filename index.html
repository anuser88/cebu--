<html>
  <head>
    <title>
      cebu--
    </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
	<script src="https://js.hcaptcha.com/1/api.js?recaptchacompat=off" async defer></script>
	<!--<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>-->
    <script>
      !async function() {
	    await new Promise(resolve=>{if(document.readyState==="complete")resolve();else window.addEventListener("load",resolve)});
        let account = localStorage.getItem("danv_user") ? JSON.parse(localStorage.getItem("danv_user")) : null;
		let ano = 0;
		if (localStorage.getItem("danv_user_ano")) {
		  account = JSON.parse(localStorage.getItem("danv_user_ano"));
		  ano = 1;
		}
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
		navigate();
		document.querySelector("#app-main-div").style.display = 'block';
        async function fetchRetry(url, opts) {
          let res = {status: 503};
          for (let i = 0;;i++) {
            try {
              res = await fetch(url, opts);
            } catch (e) {
              continue;
            }
            if (res?.status !== 503) return res;
            if (i > 7) throw new Error("Failed to fetch");
            await sleep(500);
          }
        }
		function navigate(dest = "nav-home", header = "Home") {
		  document.getElementById('nav-storage').style.display = "none";
		  document.getElementById('nav-home').style.display = "none";
		  document.getElementById('nav-settings').style.display = "none";
		  document.getElementById(dest).style.display = "block";
		  document.getElementById('app-header').textContent = header;
		  document.title = `cebu-- | ${header}`;
		}
		if (!ano) {
          if (account?.username) {
            try {
		      async function waitVerify() {
			    for(;;) {
			      if(document.querySelector('#hcaptchaShit [name="h-captcha-response"]')?.value)break;
				  console.log(document.querySelector('#hcaptchaShit [name="h-captcha-response"]')?.value);
				  await sleep(200);
			    }
			  }
			  await waitVerify();
		      let hcaptchaToken = document.querySelector('#hcaptchaShit [name="h-captcha-response"]')?.value;
              const res = await fetchRetry("https://turboshare.org.uk/api/store/daily", {
                "headers": {
                  "x-client-type": "StudioDANV-Web"
                },
                "body": JSON.stringify({
                  username: account.username,
                  sessionToken: account.sessionToken,
                  type: "single",
			      hcaptchaToken
                }),
                "method": "POST",
                "mode": "cors",
                "credentials": "include"
              }).then(x=>x.json());
              if (res?.error === "Unauthorized access detected") {
                localStorage.removeItem("danv_user");
                account = null;
              }
            } catch (e) {}
          } else {
		    localStorage.removeItem("danv_user");
		  }
		}
		document.getElementById('verify-shit').remove();
		document.getElementById('storage-btn').addEventListener('click', ()=>navigate("nav-storage", "Storage"));
		document.getElementById('settings-btn').addEventListener('click', ()=>navigate("nav-settings", "Settings"));
		document.getElementById('home-btn').addEventListener('click', ()=>navigate());
        if (account?.username) {
          fetchRetry("https://turboshare.org.uk/api/store/daily", {
            "headers": {
              "x-client-type": "StudioDANV-Web"
            },
            "body": JSON.stringify({
              username: account.username,
              sessionToken: account.sessionToken,
              type: "couple"
            }),
            "method": "POST",
            "mode": "cors",
            "credentials": "include"
          });
		  document.getElementById('lbl-lia').textContent = `Logged in as @${account.username}`;
		  document.getElementById('logout-btn').addEventListener("click", async function() {
		    localStorage.removeItem("danv_user");
		    location.reload();
		  });
		  document.getElementById('settings-notloggedin').style.display = 'none';
        } else {
		  document.getElementById('login-btn').addEventListener("click", async function() {
			document.getElementById('login-btn').disabled = true;
			document.getElementById('login-btn').classList.remove('nav-active');
			if (document.querySelector('#hcaptchaShit2 [name="h-captcha-response"]')?.value) {
			  try {
			    const username = prompt("Username:").trim();
			    const pw = prompt("Password:").trim();
				const hcaptchaToken = document.querySelector('#hcaptchaShit2 [name="h-captcha-response"]')?.value;
				const deviceId = `dev_${Math.random()}`;
				const res = await fetchRetry('https://turboshare.org.uk/api/auth/login', { 
                  method: 'POST', 
                  headers: { "Content-Type": "application/json", "X-Client-Type": "StudioDANV-Web" }, 
                  body: JSON.stringify({loginId: username, password: pw, deviceId, hcaptchaToken}) 
                }).then(x=>x.json());
				if (!res.success) throw new Error(res.error ?? 'Unknown error');
				account = { 
                  username: res.username, 
                  sessionToken: res.sessionToken, 
                  avt: res.avt, 
                  role: res.role,
                  email: res.email || "",
                  emailVerified: res.emailVerified !== undefined ? res.emailVerified : true,
                  WOW: res.WOW !== undefined ? res.WOW : (res.omg || 0),
                  frame: res.frame || null,
                  chatFrame: res.chatFrame || res.chat_frame || "",
                  banner: res.banner || ""
                };
				localStorage.setItem('danv_user', JSON.stringify(account));
				location.reload();
			  } catch (e) {alert(e)}
			  hcaptcha.reset("hcaptchaShit2");
			} else alert("Verify you are not a robot first!");
			document.getElementById('login-btn').disabled = false;
			document.getElementById('login-btn').classList.add('nav-active');
		  });
		  document.getElementById('settings-loggedin').style.display = 'none';
		}
		if (ano) {
		  document.getElementById('hcaptchaShit2').style.display = 'none';
		  document.getElementById('lbl-amr').style.display = 'none';
		  document.getElementById('ano-ena-btn').style.display = 'none';
		  document.getElementById('settings-loggedin').style.display = 'none';
		  document.getElementById('settings-notloggedin').style.display = 'none';
		  document.getElementById('ano-dis-btn').addEventListener("click", async function() {
		    localStorage.removeItem("danv_user_ano");
		    location.reload();
		  });
		  document.getElementById('upl-btn').classList.add('nav-active');
		  document.getElementById('upl-btn').disabled = false;
		  document.getElementById('upload-file').disabled = false;
		  async function uploadParts(fileInput, what = "file") {
		    const CHUNK_SIZE = 18 * 1024 * 1024;
		    const totalChunks = Math.ceil(fileInput.size / CHUNK_SIZE);
			let iv = Array.from({length: totalChunks}, (a, b) => b + 1);
			let uploadedIds = Array(totalChunks).fill();
			let wk = [];
			for (let i = 0; i < Math.min(totalChunks, 4); i++) {
			  wk.push(uploadPartsInner(iv, uploadedIds, what, fileInput, totalChunks, CHUNK_SIZE));
			}
			await Promise.all(wk);
			document.getElementById('upl-stat').textContent = "";
			console.log(uploadedIds);
			return uploadedIds;
		  }
		  async function uploadPartsInner(iv, ui, wh, fi, tc, cs) {
		    let i;
			while (i = iv.shift()) {
			  i--;
			  document.getElementById('upl-stat').textContent = `Uploading ${wh}(fragment ${i+1}/${tc})`;
		      const chunk = fi.slice(i * cs, (i + 1) * cs);
			  const chunkForm = new FormData();
			  chunkForm.append("file", chunk, `part_${i}.sb3`);
			  chunkForm.append("username", account.username);
			  chunkForm.append("sessionToken", account.sessionToken);
			  const res = await fetchRetry("https://turboshare.org.uk/api/upload", { method: 'POST', body: chunkForm, headers:{"X-Client-Type":"StudioDANV-Web"} }).then(x=>x.json());
			  if (!res || !res.success || !res.file_id) {
			    throw new Error(res?.error || "Upload failed!");
			  }
			  ui[i] = res.file_id;
			}
			console.log(i);
		  }
          document.getElementById('upl-btn').addEventListener("click", async function() {
			document.getElementById('upload-file').disabled = true;
			document.getElementById('upl-btn').classList.remove('nav-active');
			document.getElementById('upl-btn').disabled = true;
            try {
              let fileInput = document.getElementById('upload-file').files[0];
              if (!fileInput) {
			    alert("Choose a file first!");
			  } else {
			    document.getElementById('upl-stat').textContent = `Compressing file...`;
                const zip = new JSZip();
                zip.file("project.json", fileInput);
                fileInput = await zip.generateAsync({
                  type: "blob",
                  compression: "DEFLATE",
                  compressionOptions: {level: 4}
                });
                await uploadParts(fileInput);
			    alert("Upload succeeded!");
			  }
            } catch (e) {alert(`Failed to upload: ${e}`)}
			document.getElementById('upload-file').value = "";
			document.getElementById('upload-file').disabled = false;
			document.getElementById('upl-btn').classList.add('nav-active');
			document.getElementById('upl-btn').disabled = false;
          });
		} else {
		  document.getElementById('ano-dis-btn').style.display = 'none';
		  document.getElementById('ano-ena-btn').addEventListener("click", async function() {
		    document.getElementById('ano-ena-btn').disabled = true;
			document.getElementById('ano-ena-btn').classList.remove('nav-active');
			if (document.querySelector('#hcaptchaShit2 [name="h-captcha-response"]')?.value) {
			  try {
			    const username = `${Math.random().toString(36).substring(2)}_${Math.random().toString(36).substring(2)}`;
			    const pw = `${Math.random().toString(36).substring(2)}_${Math.random().toString(36).substring(2)}`;
				const email = `${Math.random().toString(36).substring(2)}_${Math.random().toString(36).substring(2)}@lmfao.com`;
				const displayName = `${Math.random().toString(36).substring(2)}_${Math.random().toString(36).substring(2)}`;
				const hcaptchaToken = document.querySelector('#hcaptchaShit2 [name="h-captcha-response"]')?.value;
				const deviceId = `dev_${Math.random()}`;
				const referralCode = '';
				const res = await fetchRetry('https://turboshare.org.uk/api/auth/register', { 
                  method: 'POST', 
                  headers: { "Content-Type": "application/json", "X-Client-Type": "StudioDANV-Web" }, 
                  body: JSON.stringify({username, email, displayName, password: pw, referralCode, deviceId, hcaptchaToken}) 
                }).then(x=>x.json());
				if (!res.success) throw new Error(res.error ?? 'Unknown error');
				account = { 
                  username: res.username, 
                  sessionToken: res.sessionToken, 
                  avt: res.avt, 
                  role: res.role,
                  email: res.email || "",
                  emailVerified: res.emailVerified !== undefined ? res.emailVerified : true,
                  WOW: res.WOW !== undefined ? res.WOW : (res.omg || 0),
                  frame: res.frame || null,
                  chatFrame: res.chatFrame || res.chat_frame || "",
                  banner: res.banner || ""
                };
				localStorage.setItem('danv_user_ano', JSON.stringify(account));
				location.reload();
			  } catch (e) {alert(e)}
			  hcaptcha.reset("hcaptchaShit2");
			} else alert("Verify you are not a robot first!");
			document.getElementById('ano-ena-btn').disabled = false;
			document.getElementById('ano-ena-btn').classList.add('nav-active');
		  });
		}
      }();
    </script>

	    height: 50px;

	  #settings-loggedin, #settings-notloggedin, #settings-ano {

	  .txt {

	  #verify-shit {

	  #home-things {
	    width: 100%;

	  }
	  #nav-storage-inner {
	    display: flex;
		flex-direction: column;
		align-items: center;
        justify-content: center;
	  }
    </style>

  <body>

		    <div class="h-captcha" id="hcaptchaShit" data-sitekey="92420ffc-6b14-4126-a31e-2e707ebc7492" data-theme="auto" style="display:flex;justify-content:center;"></div>
