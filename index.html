<!DOCTYPE html>
<html>
  <head>
    <title>
      SiBu
    </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
      !async function() {
        let account = localStorage.getItem("danv_user") ? JSON.parse(localStorage.getItem("danv_user")) : null;
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        async function fetchRetry(url, opts) {
          let res = {status: 503};
          for (let i = 0;;i++) {
            try {
              res = await fetch(url, opts);
            } catch (e) {
              continue;
            }
            if (res?.status !== 503) return res;
            if (i > 4) throw new Error("Failed to fetch");
            await sleep(500);
          }
        }
        if (account) {
          try {
            const res = await fetchRetry("https://turboshare.org.uk/api/store/daily", {
              "headers": {
                "x-client-type": "StudioDANV-Web"
              },
              "body": JSON.stringify({
                username: account.username,
                sessionToken: account.sessionToken,
                type: "single"
              }),
              "method": "POST",
              "mode": "cors",
              "credentials": "include"
            }).then(x=>x.json());
            if (res?.error === "Unauthorized access detected") {
              localStorage.removeItem("danv_user");
              account = null;
            }
          } catch (e) {}
        }
        if (account) {
          fetchRetry("https://turboshare.org.uk/api/store/daily", {
            "headers": {
              "x-client-type": "StudioDANV-Web"
            },
            "body": JSON.stringify({
              username: account.username,
              sessionToken: account.sessionToken,
              type: "couple"
            }),
            "method": "POST",
            "mode": "cors",
            "credentials": "include"
          });
          document.getElementById('upl-btn').addEventListener("click", async function() {
            try {
              const zip = new JSZip();
              let fileInput = document.getElementById('upload-file').files[0];
              if (!fileInput) return;
              zip.file(".file", fileInput);
              zip.file("project.json", '{}');
              fileInput = await zip.generateAsync({
                type: "blob",
                compression: "DEFLATE",
                compressionOptions: {level: 6}
              });
              const CHUNK_SIZE = 18 * 1024 * 1024;
              const totalChunks = Math.ceil(fileInput.size / CHUNK_SIZE);
              let uploadedIds = [];
              for (let i = 0; i < totalChunks; i++) {
                const chunk = fileInput.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                const chunkForm = new FormData();
                chunkForm.append("file", chunk, `part_${i}.sb3`);
                chunkForm.append("username", account.username);
                chunkForm.append("sessionToken", account.sessionToken);
                const res = await fetchRetry("https://turboshare.org.uk/api/upload", { method: 'POST', body: chunkForm, headers:{"X-Client-Type":"StudioDANV-Web"} }).then(x=>x.json());
                if (!res || !res.success || !res.file_id) {
                  throw new Error(res?.error || "Upload failed!");
                }
                console.log(res.file_id);
                uploadedIds.push(res.file_id);
              }
            } catch (e) {alert(`Failed to upload: ${e}`)}
          });
        }
      }();
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0px;
        background-color: #888888;
        font-family: Arial, Helvetica, sans-serif;
      }
      .navbar {
        border-radius: 0px 0px 20px 20px;
        margin-left: 10px;
        margin-right: 10px;
        padding: 5px;
        width: calc(100% - 20px);
        height: 50px;
        background-color: #555555;
        color: #dddddd;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nav-ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        gap: 15px;
      }
      button {
        border: 2px solid #777777;
        border-radius: 12px;
        padding: 10px 20px;
        background-color: #333333;
        color: white;
        cursor: pointer;
      }
      .main-app {
        border-radius: 20px;
        height: auto;
        min-height: calc(100vh - 70px);
        width: calc(100% - 40px);
        padding: 15px;
        margin-top: 10px;
        margin-left: 20px;
        margin-right: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background-color: #555555;
      }
      .main-app-inner {
        width: 100%;
        border-radius: 20px;
        padding: 15px;
        background-color: #777777;
        display: flex;
        justify-content: center;
      }
      #app-header {
        font-size: 30px;
        font-weight: bold;
        padding: 5px;
        color: #ffffff;
      }
      #app-main-div {
        height: 100%;
        flex: 1;
      }
      .page-footer {
        border-radius: 20px 20px 0px 0px;
        height: 200px;
        width: calc(100% - 20px);
        padding: 15px;
        margin-top: 10px;
        margin-left: 10px;
        margin-right: 10px;
        display: flex;
        justify-content: center;
        background-color: #555555;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <ul class="nav-ul">
        <li><button class="nav-btn">Home</button></li>
        <li><button class="nav-btn">Projects</button></li>
        <li><button class="nav-btn">Settings</button></li>
      </ul>
    </nav>
    <main class="main-app">
      <header class="main-app-inner" id="app-header">
        Home
      </header>
      <div class="main-app-inner" id="app-main-div">
        <input type="file" id="upload-file" name="upload-file">
        <button id="upl-btn">Upload</button>
      </div>
    </main>
    <footer class="page-footer">
      foo baz bar
    </footer>
  </body>
</html>
