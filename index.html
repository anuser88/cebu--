<!DOCTYPE html>
<html>
  <head>
    <title>
      SiBu
    </title>
    <script>
      !async function() {
        let account = localStorage.getItem("danv_user") ? JSON.parse(localStorage.getItem("danv_user")) : null;
        if (account) {
          const res = await fetch("https://turboshare.org.uk/api/store/daily", {
            "headers": {
              "x-client-type": "StudioDANV-Web"
            },
            "body": JSON.stringify({
              username: account.username,
              sessionToken: account.sessionToken,
              type: "single"
            }),
            "method": "POST",
            "mode": "cors",
            "credentials": "include"
          }).then(x=>x.json());
          if (res?.error === "Unauthorized access detected") {
            localStorage.removeItem("danv_user");
            account = null;
          }
        }
      }();
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0px;
        background-color: #888888;
        font-family: Arial, Helvetica, sans-serif;
      }
      .navbar {
        border-radius: 0px 0px 20px 20px;
        margin-left: 10px;
        margin-right: 10px;
        padding: 5px;
        width: calc(100% - 20px);
        height: 50px;
        background-color: #555555;
        color: #dddddd;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nav-ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        gap: 15px;
      }
      .nav-btn {
        border: 2px solid #777777;
        border-radius: 12px;
        padding: 10px 20px;
        background-color: #333333;
        color: white;
        cursor: pointer;
      }
      .main-app {
        border-radius: 20px;
        height: auto;
        min-height: calc(100vh - 70px);
        width: calc(100% - 40px);
        padding: 15px;
        margin-top: 10px;
        margin-left: 20px;
        margin-right: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background-color: #555555;
      }
      .main-app-inner {
        width: 100%;
        border-radius: 20px;
        padding: 15px;
        background-color: #777777;
        display: flex;
        justify-content: center;
      }
      #app-header {
        font-size: 30px;
        font-weight: bold;
        padding: 5px;
        color: #ffffff;
      }
      #app-main-div {
        height: 100%;
        flex: 1;
      }
      .page-footer {
        border-radius: 20px 20px 0px 0px;
        height: 200px;
        width: calc(100% - 20px);
        padding: 15px;
        margin-top: 10px;
        margin-left: 10px;
        margin-right: 10px;
        display: flex;
        justify-content: center;
        background-color: #555555;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <ul class="nav-ul">
        <li><button class="nav-btn">Home</button></li>
        <li><button class="nav-btn">Projects</button></li>
        <li><button class="nav-btn">Settings</button></li>
      </ul>
    </nav>
    <main class="main-app">
      <header class="main-app-inner" id="app-header">
        Home
      </header>
      <div class="main-app-inner" id="app-main-div">
        foo baz bar
      </div>
    </main>
    <footer class="page-footer">
      foo baz bar
    </footer>
  </body>
</html>
